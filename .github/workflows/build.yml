name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Three stages on purpose. Previously both matrix jobs tried to create the
# release themselves; they run in parallel, both saw no release, both tried to
# create one, and whichever lost failed with "already_exists" — leaving that
# platform's artifacts unpublished and latest.json incomplete.
#
# Now: one job creates a draft, both builds upload into it, and a final job
# publishes. The draft also means users never see a half-uploaded release.
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # The build takes its version from tauri.conf.json; the tag only triggers
      # it. Tagging v0.1.42 while the config still says 0.1.41 therefore builds
      # 0.1.41 and collides with the release that already exists — 17 minutes
      # in, with a message that says nothing about versions. Catch it in six
      # seconds instead.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version ${{ steps.version.outputs.version }} in src-tauri/tauri.conf.json. Bump the config to match, then re-tag."
            exit 1
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tag = `v${version}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Drafts don't reserve their tag, so re-running a failed build used
            // to leave a second draft claiming the same one. Publishing then
            // failed with "already_exists" and the run looked like a compile
            // error when it wasn't. Reuse whatever draft is already there.
            const existing = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });

            const published = existing.find((r) => r.tag_name === tag && !r.draft);
            if (published) {
              core.setFailed(
                `v${version} is already released. Bump the version in ` +
                `src-tauri/tauri.conf.json and tag again.`
              );
              return '';
            }

            const draft = existing.find((r) => r.tag_name === tag && r.draft);
            if (draft) {
              core.info(`Reusing existing draft ${draft.id} for ${tag}.`);
              return draft.id;
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Drop Involve v${version}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    steps:
      - uses: actions/checkout@v4

      # NOTE: the input is "node-version", not "node_version". The old spelling
      # was silently ignored, so builds ran on whatever Node the runner shipped.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS only)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build the Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the bundle at build time. Without this the app falls back
          # to the default in src/lib/api.js.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://file.involve.no' }}
        with:
          # Upload into the release made above rather than creating one.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest

    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
